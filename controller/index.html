<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS Controller</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">

      <header>
        <h1 class="title">JARVIS CONTROLLER</h1>
      </header>

      <div class="services-grid">

        <!-- ── JARVIS section ── -->
        <div class="service-card">
          <div class="service-label">JARVIS</div>

          <!-- Backend sub-row -->
          <div class="sub-service">
            <div class="sub-service-label">BACKEND</div>
            <section class="status-section">
              <div class="status-pill" id="backend-status-pill">
                <span class="dot" id="backend-dot"></span>
                <span class="state-text" id="backend-state-text">checking...</span>
              </div>
              <div class="http-indicator" id="backend-http-indicator">HTTP :8766 · checking</div>
            </section>
            <section class="controls">
              <button class="btn btn-start"   id="btn-backend-start"   disabled>START</button>
              <button class="btn btn-stop"    id="btn-backend-stop"    disabled>STOP</button>
              <button class="btn btn-restart" id="btn-backend-restart" disabled>RESTART</button>
            </section>
          </div>

          <!-- Frontend sub-row -->
          <div class="sub-service">
            <div class="sub-service-label">FRONTEND</div>
            <section class="status-section">
              <div class="status-pill" id="frontend-status-pill">
                <span class="dot" id="frontend-dot"></span>
                <span class="state-text" id="frontend-state-text">checking...</span>
              </div>
              <div class="http-indicator" id="frontend-http-indicator">HTTP :5173 · checking</div>
            </section>
            <section class="controls">
              <button class="btn btn-start"   id="btn-frontend-start"   disabled>START</button>
              <button class="btn btn-stop"    id="btn-frontend-stop"    disabled>STOP</button>
              <button class="btn btn-restart" id="btn-frontend-restart" disabled>RESTART</button>
            </section>
            <button class="btn btn-link" id="btn-link-jarvis" disabled>Open JARVIS UI →</button>
          </div>
        </div>

        <!-- ── OpenClaw section ── -->
        <div class="service-card">
          <div class="service-label">OPENCLAW</div>

          <section class="status-section">
            <div class="status-pill" id="openclaw-status-pill">
              <span class="dot" id="openclaw-dot"></span>
              <span class="state-text" id="openclaw-state-text">checking...</span>
            </div>
            <div class="http-indicator" id="openclaw-http-indicator">HTTP :18789 · checking</div>
          </section>

          <section class="target-toggle">
            <button class="target-option" id="toggle-local"  data-target="local">LOCAL</button>
            <button class="target-option" id="toggle-remote" data-target="remote">REMOTE</button>
          </section>
          <div class="target-url" id="openclaw-target-url"></div>

          <section class="controls">
            <button class="btn btn-start"   id="btn-openclaw-start"   disabled>START</button>
            <button class="btn btn-stop"    id="btn-openclaw-stop"    disabled>STOP</button>
            <button class="btn btn-restart" id="btn-openclaw-restart" disabled>RESTART</button>
          </section>
        </div>

      </div>

      <!-- ── Link buttons ── -->
      <section class="links-row">
        <button class="btn btn-link" id="btn-link-openclaw">Open OpenClaw Control →</button>
      </section>

      <div class="toast" id="toast"></div>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
