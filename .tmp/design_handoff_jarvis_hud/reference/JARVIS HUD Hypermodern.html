<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>JARVIS — MK. XLII</title>
<link rel="icon" type="image/svg+xml" href="design-system/favicon.svg"/>
<link rel="stylesheet" href="design-system/colors_and_type.css"/>
<style>
  :root {
    --tweak-hue: 215;
  }
  html, body, #root { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background: var(--bg); }
  * { box-sizing: border-box; }

  /* ────────── scene ────────── */
  .scene { position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 52%, #0a1220 0%, #05080f 45%, #020206 100%);
  }
  .scene .grid {
    position:absolute; inset:-4px; pointer-events:none;
    background-image:
      linear-gradient(rgba(76,168,232,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(76,168,232,0.055) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 80% 65% at 50% 55%, black 10%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse 80% 65% at 50% 55%, black 10%, transparent 85%);
    animation: gridDrift 28s linear infinite;
  }
  @keyframes gridDrift { to { background-position: 44px 44px, 44px 44px; } }
  .scene .scanlines {
    position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(110,196,255,0.025) 3px, rgba(110,196,255,0.025) 4px);
    mix-blend-mode:screen; opacity:.7;
  }
  .scene .vignette {
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,.78) 100%);
  }
  .scene .noise {
    position:absolute; inset:0; pointer-events:none; opacity:.06; mix-blend-mode:overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
  }
  .scene .horizon {
    position:absolute; left:0; right:0; bottom:0; height: 38%;
    background: linear-gradient(to top, rgba(76,168,232,.08), transparent);
    pointer-events:none;
  }
  .scene .stars { position:absolute; inset:0; pointer-events:none; opacity:.6; }
  .scene .stars i {
    position:absolute; width:1px; height:1px; background: var(--text); border-radius:50%;
    box-shadow: 0 0 4px var(--accent-bright);
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:1} }

  /* Viewport corner HUD marks */
  .hud-corner { position:fixed; width:32px; height:32px; border-color: var(--accent); border-style:solid; opacity:.55; z-index:4; pointer-events:none; }
  .hud-corner.tl { top:6px; left:6px; border-width:1px 0 0 1px; }
  .hud-corner.tr { top:6px; right:6px; border-width:1px 1px 0 0; }
  .hud-corner.bl { bottom:6px; left:6px; border-width:0 0 1px 1px; }
  .hud-corner.br { bottom:6px; right:6px; border-width:0 1px 1px 0; }
  .hud-corner::before { content:''; position:absolute; width:4px; height:4px; background: var(--accent-bright); box-shadow: 0 0 6px var(--accent-bright);}
  .hud-corner.tl::before { top:-2px; left:-2px;} .hud-corner.tr::before { top:-2px; right:-2px;}
  .hud-corner.bl::before { bottom:-2px; left:-2px;} .hud-corner.br::before { bottom:-2px; right:-2px;}

  /* Edge rulers */
  .ruler { position:fixed; z-index:4; pointer-events:none; color: var(--text-muted); font-size:8px; letter-spacing:1px; }
  .ruler.top { top:44px; left:50%; transform:translateX(-50%); display:flex; gap:12px; }
  .ruler.bot { bottom:64px; left:50%; transform:translateX(-50%); display:flex; gap:12px; opacity:.5; }
  .ruler i { display:block; width:1px; height:8px; background: var(--accent-dim); opacity:.8; }
  .ruler span { font-family: var(--font); }

  /* ────────── orb ────────── */
  .orb-wrap { position:fixed; left:50%; top:50%; transform: translate(-50%,-50%); z-index:1; pointer-events:none; }
  .orb {
    width: 280px; height: 280px; border-radius:50%; position:relative;
    background:
      radial-gradient(circle at 48% 42%, #ffffff 0%, #d9efff 6%, #7ecbff 18%, #4ca8e8 34%, rgba(76,168,232,.4) 58%, rgba(76,168,232,0) 82%);
    box-shadow: 0 0 70px #4ca8e8cc, 0 0 180px #4ca8e866, inset 0 0 50px #e8f4ff33;
    animation: orbFloat 6.5s ease-in-out infinite;
    filter: saturate(1.1);
  }
  .orb::before {
    content:''; position:absolute; inset:28%; border-radius:50%;
    background: radial-gradient(circle at 45% 40%, #ffffff 0%, #e8f4ff 35%, #6ec4ff 85%, #4ca8e8 100%);
    box-shadow: 0 0 28px #e8f4ffcc;
  }
  .orb::after {
    content:''; position:absolute; inset:44%; border-radius:50%;
    background: #ffffff; box-shadow: 0 0 14px #ffffffcc, 0 0 28px #a8e0ff99;
  }
  @keyframes orbFloat { 0%,100%{ transform: translateY(-4px);} 50%{ transform: translateY(6px);} }

  .orb.state-thinking { animation: orbFloat 6.5s ease-in-out infinite, orbThink 2.6s linear infinite; }
  @keyframes orbThink { to { filter: saturate(1.15) hue-rotate(8deg); } }
  .orb.state-speaking { animation: orbFloat 6.5s ease-in-out infinite, orbSpeak 0.6s ease-in-out infinite; }
  @keyframes orbSpeak { 0%,100%{ box-shadow: 0 0 70px #5ab8f0cc, 0 0 180px #5ab8f066, inset 0 0 50px #e8f4ff33; } 50%{ box-shadow: 0 0 110px #6ec4ffee, 0 0 260px #6ec4ff88, inset 0 0 70px #e8f4ff55;} }
  .orb.state-listening { animation: orbFloat 6.5s ease-in-out infinite, orbListen 1.4s ease-in-out infinite; }
  @keyframes orbListen { 0%,100%{ transform: translateY(-4px) scale(1);} 50%{ transform: translateY(-4px) scale(1.03);} }

  /* WORKING state — amber tool-execution tint (see DS: --orb-working) */
  .orb.state-working {
    background: radial-gradient(circle at 48% 42%, #ffffff 0%, #fff2d6 6%, #ffce7a 18%, #e8a84c 34%, rgba(232,168,76,.4) 58%, rgba(232,168,76,0) 82%);
    box-shadow: 0 0 70px #e8a84ccc, 0 0 180px #e8a84c66, inset 0 0 50px #fff2d633;
    animation: orbFloat 6.5s ease-in-out infinite, orbWork 1.6s linear infinite;
  }
  .orb.state-working::before { background: radial-gradient(circle at 45% 40%, #ffffff 0%, #fff2d6 35%, #ffce7a 85%, #e8a84c 100%); box-shadow: 0 0 28px #fff2d6cc; }
  @keyframes orbWork {
    0%,100%{ box-shadow: 0 0 70px #e8a84ccc, 0 0 180px #e8a84c66, inset 0 0 50px #fff2d633;}
    50%    { box-shadow: 0 0 110px #ffce7aee, 0 0 240px #e8a84c88, inset 0 0 70px #fff2d655;}
  }
  /* Amber rings + pulse when working */
  .app.is-working .ring { border-color: rgba(232,168,76,.4) !important; }
  .app.is-working .pulse { border-color: var(--warning); }
  .app.is-working .particle { background: var(--warning) !important; box-shadow: 0 0 8px var(--warning) !important; }

  /* Concentric rings — hypermodern */
  .ring { position:absolute; left:50%; top:50%; border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; }
  .ring.r1 { width: 360px; height:360px; border:1px dashed rgba(76,168,232,.55); animation: spin 32s linear infinite; }
  .ring.r2 { width: 460px; height:460px; border:1px solid rgba(76,168,232,.35); animation: spin 48s linear infinite reverse; }
  .ring.r3 { width: 580px; height:580px; border:1px dotted rgba(110,196,255,.35); animation: spin 70s linear infinite; }
  .ring.r4 { width: 740px; height:740px; border:1px solid rgba(76,168,232,.15); animation: spin 120s linear infinite reverse; }
  .ring.r5 { width: 920px; height:920px; border:1px dashed rgba(110,196,255,.1); animation: spin 180s linear infinite; }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

  /* Tick-marks around ring2 */
  .ring-ticks { position:absolute; left:50%; top:50%; width: 460px; height:460px; transform:translate(-50%,-50%); pointer-events:none; animation: spin 110s linear infinite; }
  .ring-ticks i { position:absolute; left:50%; top:0; width:1px; height:8px; background: var(--accent); box-shadow: 0 0 4px var(--accent); transform-origin: 0 230px; }

  /* Reticle labels orbiting */
  .ring-label { position:absolute; left:50%; top:50%; transform-origin: 0 0; font-size:8px; letter-spacing:2px; color: var(--accent-dim); text-transform:uppercase; pointer-events:none; font-family: var(--font); }

  /* Pulse rings when listening */
  .pulse { position:absolute; left:50%; top:50%; width:280px; height:280px; border-radius:50%; transform:translate(-50%,-50%); border:1px solid var(--accent-bright); opacity:0; }
  .state-listening ~ .pulse { animation: pulse 1.8s ease-out infinite; }
  .state-listening ~ .pulse.d2 { animation-delay:.6s; }
  .state-listening ~ .pulse.d3 { animation-delay:1.1s; }
  @keyframes pulse { 0%{ transform: translate(-50%,-50%) scale(1); opacity:.85;} 100%{ transform: translate(-50%,-50%) scale(2.4); opacity:0;} }

  /* Orbiting particles */
  .particle { position:absolute; left:50%; top:50%; width:3px; height:3px; border-radius:50%; background: var(--accent-bright); box-shadow: 0 0 8px var(--accent-bright); transform-origin: 0 0; }

  /* Reactor base under the orb */
  .reactor {
    position:fixed; left:50%; bottom:-360px; width:900px; height:900px; transform:translateX(-50%);
    border-radius:50%; z-index:0; pointer-events:none;
    background: radial-gradient(circle at 50% 0%, rgba(76,168,232,.14) 0%, rgba(76,168,232,.03) 35%, transparent 62%);
  }
  .reactor::before {
    content:''; position:absolute; left:50%; top:0; width: 540px; height: 540px; transform:translateX(-50%);
    border-top: 1px solid rgba(76,168,232,.3); border-radius:50%;
  }

  /* ────────── top bar ────────── */
  .topbar {
    position:fixed; top:10px; left:10px; right:10px; height:40px; z-index:30;
    display:flex; align-items:center; justify-content:space-between; padding:0 16px;
    background: rgba(13,13,20,.55); backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 2px;
  }
  /* Topbar corner brackets — gently breathing */
  .topbar::before, .topbar::after {
    content:''; position:absolute; width:12px; height:12px; border-color: var(--accent); border-style:solid;
    animation: tbCornerBreath 3.4s ease-in-out infinite;
  }
  .topbar::before { top:-2px; left:-2px; border-width:1px 0 0 1px; }
  .topbar::after  { top:-2px; right:-2px; border-width:1px 1px 0 0; animation-delay:-1.7s; }
  .topbar .c-bl, .topbar .c-br {
    position:absolute; width:12px; height:12px; border-color: var(--accent); border-style:solid;
    animation: tbCornerBreath 3.4s ease-in-out infinite;
  }
  .topbar .c-bl { bottom:-2px; left:-2px;  border-width:0 0 1px 1px; animation-delay:-.85s; }
  .topbar .c-br { bottom:-2px; right:-2px; border-width:0 1px 1px 0; animation-delay:-2.55s; }
  @keyframes tbCornerBreath {
    0%,100% { width:12px; height:12px; border-color: var(--accent-dim); }
    50%     { width:18px; height:18px; border-color: var(--accent-bright); }
  }

  /* Topbar circumnavigating trace — a thin light runs around the entire bar */
  .topbar .trace { position:absolute; inset:-1px; pointer-events:none; overflow:hidden; border-radius:2px; }
  .topbar .trace::before, .topbar .trace::after {
    content:''; position:absolute; background:
      linear-gradient(90deg, transparent 0%, var(--accent) 40%, var(--accent-bright) 50%, var(--accent) 60%, transparent 100%);
    box-shadow: 0 0 8px var(--accent-bright);
  }
  /* Top + bottom horizontal rails */
  .topbar .trace::before {
    top:0; left:-40%; width:40%; height:1px;
    animation: traceTop 5.2s linear infinite;
  }
  .topbar .trace::after {
    bottom:0; right:-40%; width:40%; height:1px;
    animation: traceBot 5.2s linear infinite;
    animation-delay:-2.6s;
  }
  @keyframes traceTop {
    0%   { left:-40%; opacity:0; }
    8%   { opacity:1; }
    92%  { opacity:1; }
    100% { left:100%; opacity:0; }
  }
  @keyframes traceBot {
    0%   { right:-40%; opacity:0; }
    8%   { opacity:1; }
    92%  { opacity:1; }
    100% { right:100%; opacity:0; }
  }
  /* Vertical rails on sides (slim) */
  .topbar .trace i {
    position:absolute; width:1px; background:
      linear-gradient(180deg, transparent 0%, var(--accent) 40%, var(--accent-bright) 50%, var(--accent) 60%, transparent 100%);
    box-shadow: 0 0 6px var(--accent-bright);
  }
  .topbar .trace i.l { left:0; top:-40%; height:40%;  animation: traceLeft 5.2s linear infinite;  animation-delay:-3.9s; }
  .topbar .trace i.r { right:0; bottom:-40%; height:40%; animation: traceRight 5.2s linear infinite; animation-delay:-1.3s; }
  @keyframes traceLeft  { 0%{top:-40%;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{top:100%;opacity:0} }
  @keyframes traceRight { 0%{bottom:-40%;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{bottom:100%;opacity:0} }

  .infobar { display:flex; align-items:center; gap:10px; font-size:11px; color:var(--text-secondary); letter-spacing:1px; font-variant-numeric: tabular-nums; }
  .infobar .t { color: var(--text); font-weight:500; }
  .infobar .d { color: var(--text-secondary); }
  .infobar .w { display:inline-flex; gap:4px; align-items:center; color: var(--text); }
  .infobar .w .g { color: var(--accent-bright); font-size:13px; }
  .infobar .sep { color: var(--text-muted); opacity:.7; }
  .infobar .tag { font-size:8px; letter-spacing:2px; color: var(--accent); border:1px solid var(--accent-dim); padding:2px 6px; }
  .infobar .tag .dot { display:inline-block; width:5px; height:5px; background: var(--success); border-radius:50%; box-shadow: 0 0 5px var(--success); margin-right:4px; vertical-align:middle; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

  .brand { font-size:9px; letter-spacing:8px; color:var(--text-muted); text-transform:uppercase; }
  .brand b { color: var(--accent-bright); font-weight:500; }

  .tb-right { display:flex; gap:6px; align-items:center; }
  .ibtn { width:28px; height:28px; border:1px solid var(--border); background: rgba(13,13,20,.6); color: var(--text-secondary); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; border-radius:2px; transition: all .2s; }
  .ibtn:hover { color: var(--accent-bright); border-color: var(--accent); box-shadow: var(--glow); }
  .ibtn.on { color: var(--accent-bright); border-color: var(--accent); box-shadow: var(--glow); }
  .ibtn svg { width:13px; height:13px; }

  /* ────────── panels (windows) ────────── */
  .panel {
    position:fixed; z-index:10;
    background: rgba(13,13,20,.72); backdrop-filter: blur(12px);
    border:1px solid var(--border); border-radius:2px;
    display:flex; flex-direction:column; overflow:hidden;
    animation: winIn .5s var(--ease) both;
    transition: border-color .25s, box-shadow .25s, transform .25s;
  }
  @keyframes winIn { 0%{opacity:0; transform: translateY(8px) scale(.985); clip-path: inset(46% 0 46% 0);} 60%{clip-path: inset(0 0 0 0); opacity:1;} 100%{ transform: none;} }
  /* Focus/Hover volumetric bloom — a radial wash INSIDE the card that pulses.
     Lives on ::after with screen blend so it glows without looking like a drop-shadow. */
  .panel:hover { border-color: var(--accent-dim); }
  .panel.focused { border-color: var(--accent); }
  .panel::after {
    content:''; position:absolute; inset:0; pointer-events:none; border-radius:2px;
    background:
      radial-gradient(120% 70% at 50% 0%,   color-mix(in srgb, var(--accent) 16%, transparent) 0%, transparent 55%),
      radial-gradient(120% 70% at 50% 100%, color-mix(in srgb, var(--accent) 10%, transparent) 0%, transparent 55%);
    mix-blend-mode: screen;
    opacity:0; transition: opacity .3s ease;
  }
  .panel:hover::after   { opacity:.55; animation: panelBloom 3s ease-in-out infinite; }
  .panel.focused::after { opacity:1;   animation: panelBloom 2.6s ease-in-out infinite; }
  @keyframes panelBloom {
    0%,100% { filter: brightness(.85); }
    50%     { filter: brightness(1.25); }
  }

  /* Panel circumnavigating trace — a thin light runs around every card */
  .panel .trace { position:absolute; inset:-1px; pointer-events:none; overflow:hidden; border-radius:2px; z-index:3; }
  .panel .trace::before, .panel .trace::after {
    content:''; position:absolute;
    background: linear-gradient(90deg, transparent 0%, var(--accent) 40%, var(--accent-bright) 50%, var(--accent) 60%, transparent 100%);
    box-shadow: 0 0 8px var(--accent-bright);
    opacity:.55;
  }
  .panel .trace::before {
    top:0; left:-40%; width:40%; height:1px;
    animation: pTraceTop 6s linear infinite;
  }
  .panel .trace::after {
    bottom:0; right:-40%; width:40%; height:1px;
    animation: pTraceBot 6s linear infinite;
    animation-delay:-3s;
  }
  .panel .trace i {
    position:absolute; width:1px;
    background: linear-gradient(180deg, transparent 0%, var(--accent) 40%, var(--accent-bright) 50%, var(--accent) 60%, transparent 100%);
    box-shadow: 0 0 6px var(--accent-bright);
    opacity:.55;
  }
  .panel .trace i.l { left:0; top:-40%; height:40%; animation: pTraceLeft 6s linear infinite; animation-delay:-4.5s; }
  .panel .trace i.r { right:0; bottom:-40%; height:40%; animation: pTraceRight 6s linear infinite; animation-delay:-1.5s; }
  .panel:hover .trace::before, .panel:hover .trace::after,
  .panel:hover .trace i { opacity:.9; }
  .panel.focused .trace::before, .panel.focused .trace::after,
  .panel.focused .trace i { opacity:1; }
  @keyframes pTraceTop   { 0%{left:-40%; opacity:0} 8%{opacity:.6} 92%{opacity:.6} 100%{left:100%; opacity:0} }
  @keyframes pTraceBot   { 0%{right:-40%; opacity:0} 8%{opacity:.6} 92%{opacity:.6} 100%{right:100%; opacity:0} }
  @keyframes pTraceLeft  { 0%{top:-40%; opacity:0} 8%{opacity:.6} 92%{opacity:.6} 100%{top:100%; opacity:0} }
  @keyframes pTraceRight { 0%{bottom:-40%; opacity:0} 8%{opacity:.6} 92%{opacity:.6} 100%{bottom:100%; opacity:0} }

  /* corner brackets */
  .panel .ck { position:absolute; width:10px; height:10px; border-color: var(--accent); border-style:solid; opacity:.7; transition: width .3s var(--ease), height .3s var(--ease), opacity .25s, border-color .25s; pointer-events:none; }
  .panel .ck.tl { top:-2px; left:-2px; border-width:1px 0 0 1px; }
  .panel .ck.tr { top:-2px; right:-2px; border-width:1px 1px 0 0; }
  .panel .ck.bl { bottom:-2px; left:-2px; border-width:0 0 1px 1px; }
  .panel .ck.br { bottom:-2px; right:-2px; border-width:0 1px 1px 0; }
  .panel:hover .ck { width:14px; height:14px; opacity:.85; border-color: var(--accent-bright); }
  .panel.focused .ck { width:20px; height:20px; opacity:1; border-color: var(--accent-bright); animation: cornerBreath 2.6s ease-in-out infinite; }
  @keyframes cornerBreath {
    0%,100% { width:18px; height:18px; border-color: var(--accent); }
    50%     { width:22px; height:22px; border-color: var(--accent-bright); }
  }

  .panel .hdr {
    height: 26px; padding: 0 10px; display:flex; align-items:center; gap:8px;
    border-bottom: 1px solid var(--border);
    font-size:9px; letter-spacing:2px; text-transform:uppercase; color: var(--text-secondary);
    background: rgba(76,168,232,.04);
    position:relative;
  }
  .panel .hdr .ix { color: var(--accent-bright); font-weight:500; opacity:.8; }
  .panel .hdr .tt { flex:1; overflow:hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
  .panel.focused .hdr .tt { color: var(--text); }
  .panel .hdr .badge { font-size:8px; letter-spacing:1px; color: var(--accent); border: 1px solid var(--accent-dim); padding: 1px 4px; border-radius: 2px; }
  .panel .hdr .dots { display:flex; gap:3px; margin-left:6px; }
  .panel .hdr .dots i { width:4px; height:4px; background: var(--text-muted); }
  .panel .hdr .dots i:nth-child(1) { background: var(--accent); box-shadow: var(--glow);}
  .panel.focused .hdr::after {
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
    animation: shimmer 2s linear infinite;
  }
  @keyframes shimmer { from { transform: translateX(-100%);} to { transform: translateX(100%);} }

  .panel .body { flex:1; padding: 12px; overflow:auto; font-size:11px; }
  .panel .body::-webkit-scrollbar { width:4px; }
  .panel .body::-webkit-scrollbar-thumb { background: var(--border); }

  /* side rails */
  .panel .rail { position:absolute; top:26px; bottom:4px; width:2px; pointer-events:none;
    background-image: linear-gradient(to bottom, var(--accent) 0 2px, transparent 2px 10px);
    background-size: 2px 10px; opacity:0; transition: opacity .3s; }
  .panel .rail.l { left:-4px; }
  .panel .rail.r { right:-4px; }
  .panel:hover .rail, .panel.focused .rail { opacity:.7; }

  /* ────────── panel content ────────── */

  /* system tiles */
  .tiles { display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile .top { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
  .tile .lbl { font-size:9px; letter-spacing:1px; color: var(--text-secondary); text-transform: uppercase; }
  .tile .val { font-size:12px; color: var(--accent-bright); font-weight:500; font-variant-numeric: tabular-nums; }
  .tile .val .u { font-size:9px; color: var(--text-muted); margin-left:1px; }
  .tile.warn .val { color: var(--warning); }
  .tile svg { width:100%; height:28px; display:block; }
  .tile .sub { font-size:8px; letter-spacing:1px; color: var(--text-muted); margin-top:3px; }

  /* bars */
  .bar2 { height:2px; background: var(--border); overflow:hidden; position:relative; margin: 4px 0; }
  .bar2 .fi { height:100%; background: var(--accent); box-shadow: var(--glow); }

  /* transcript */
  .turn { margin-bottom: 10px; display:flex; }
  .turn.user { justify-content: flex-end; }
  .turn .blk { max-width: 84%; }
  .turn .meta { font-size:8px; letter-spacing:1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; }
  .turn.user .meta { text-align:right; }
  .turn.jarvis .meta b { color: var(--accent); font-weight:500; margin-right:4px; }
  .turn.user .bub { color: var(--text-secondary); font-size:11px; line-height:1.5; padding: 2px 0; text-align:right; }
  .turn.jarvis .bub { background: rgba(76,168,232,.06); border:1px solid var(--border); padding:6px 8px; font-size:11px; line-height:1.5; color: var(--text); border-radius:2px; position:relative; }
  .turn.jarvis .bub::before { content:''; position:absolute; left:-4px; top:-1px; width:2px; height:calc(100% + 2px); background: var(--accent); box-shadow: var(--glow); }

  /* now playing */
  .np { display:flex; gap:10px; align-items:center; }
  .np .art { width:54px; height:54px; flex-shrink:0; border-radius:2px;
    background: linear-gradient(135deg, #1a3a5c, #4ca8e8 55%, #6ec4ff);
    position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;
    font-weight:700; color: var(--bg); font-size:11px; letter-spacing:1px;
    box-shadow: var(--glow);
  }
  .np .art::after { content:''; position:absolute; inset:0; background: repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,.06) 4px 5px); }
  .np .art::before { content:''; position:absolute; inset:20%; border: 1px solid rgba(255,255,255,.35); border-radius:50%; }
  .np .meta { flex:1; min-width:0; }
  .np .meta .ti { font-size:12px; color: var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np .meta .ar { font-size:10px; color: var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np .meta .al { font-size:9px; color: var(--text-muted); letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np-progress { display:flex; justify-content:space-between; font-size:9px; color: var(--text-muted); letter-spacing:1px; margin-top:3px; }
  .np-ctl { display:flex; justify-content:center; align-items:center; gap:8px; margin-top:10px; }
  .tbtn { width:26px; height:26px; border:1px solid var(--border); background:transparent; color: var(--text-secondary); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; border-radius:2px; transition: all .2s; }
  .tbtn:hover { color: var(--accent-bright); border-color: var(--accent); box-shadow: var(--glow); }
  .tbtn.pri { width:32px; height:32px; background: var(--accent); color: var(--bg); border-color: var(--accent); box-shadow: var(--glow); }
  .tbtn.pri:hover { background: var(--accent-bright); box-shadow: var(--glow-strong); }
  .tbtn svg { width:11px; height:11px; }
  /* audio waveform overlay on art */
  .wave-strip { display:flex; gap:2px; align-items:flex-end; height:12px; margin-top:4px; }
  .wave-strip i { display:block; width:2px; background: var(--accent); box-shadow: var(--glow); animation: wave 0.9s ease-in-out infinite; }
  .wave-strip i:nth-child(1){animation-delay:-.6s} .wave-strip i:nth-child(2){animation-delay:-.4s} .wave-strip i:nth-child(3){animation-delay:-.2s}
  .wave-strip i:nth-child(4){animation-delay:0s} .wave-strip i:nth-child(5){animation-delay:-.3s} .wave-strip i:nth-child(6){animation-delay:-.5s}
  .wave-strip i:nth-child(7){animation-delay:-.1s}
  @keyframes wave { 0%,100%{ height:2px;} 50%{ height:12px;} }

  /* agenda */
  .ev { display:flex; gap:8px; padding:6px 0; border-bottom: 1px dashed var(--border); }
  .ev:last-child { border-bottom: none; }
  .ev .tm { width:44px; flex-shrink:0; font-size:11px; color: var(--accent-bright); font-variant-numeric: tabular-nums; letter-spacing:1px; }
  .ev .tx { flex:1; min-width:0; }
  .ev .tx .nm { font-size:11px; color: var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev .tx .sub { font-size:9px; letter-spacing:1px; color: var(--text-muted); text-transform:uppercase; }
  .ev .pil { font-size:8px; letter-spacing:1px; padding: 1px 5px; border:1px solid var(--border); color: var(--text-secondary); text-transform:uppercase; align-self:center; border-radius:2px; }
  .ev .pil.on { color: var(--success); border-color: rgba(76,232,168,.4); }
  .ev .pil.n  { color: var(--accent-bright); border-color: var(--accent-dim); }

  /* notifications */
  .nf { display:flex; flex-direction:column; padding:6px 0; border-bottom:1px dashed var(--border); gap:2px; }
  .nf:last-child { border-bottom:none; }
  .nf .h { display:flex; align-items:center; gap:6px; }
  .nf .src { font-size:8px; letter-spacing:1px; color: var(--accent); text-transform:uppercase; }
  .nf.warn .src { color: var(--warning); }
  .nf.err .src { color: var(--error); }
  .nf .ti { margin-left:auto; font-size:8px; letter-spacing:1px; color: var(--text-muted); }
  .nf .tx { font-size:11px; color: var(--text); line-height:1.4; }

  /* lights */
  .lights { display:grid; grid-template-columns: repeat(2,1fr); gap:8px; }
  .lt { border:1px solid var(--border); padding:7px 9px; cursor:pointer; transition: all .2s; display:flex; flex-direction:column; gap:4px; border-radius:2px; }
  .lt:hover { border-color: var(--accent); box-shadow: var(--glow); }
  .lt.on { border-color: var(--accent); box-shadow: var(--glow-inner); }
  .lt .r1 { display:flex; justify-content:space-between; align-items:center; }
  .lt .nm { font-size:10px; letter-spacing:1px; text-transform:uppercase; color: var(--text-secondary); }
  .lt.on .nm { color: var(--accent-bright); }
  .lt .bb { width:10px; height:10px; background: var(--text-muted); border-radius:50%; }
  .lt.on .bb { background: var(--accent-bright); box-shadow: 0 0 8px var(--accent-bright); }
  .lt .dim { font-size:9px; color: var(--text-muted); font-variant-numeric: tabular-nums; letter-spacing:1px; }
  .lt .br { height:2px; background: var(--border); }
  .lt .br i { display:block; height:100%; background: var(--accent); box-shadow: var(--glow); }

  /* ────────── bottom PTT + status ────────── */
  .dock {
    position:fixed; left:50%; bottom: 24px; transform: translateX(-50%); z-index:25;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .ptt {
    width:72px; height:72px; border-radius:50%; border:1px solid var(--accent); background: radial-gradient(circle at 50% 35%, rgba(110,196,255,.3), rgba(13,13,20,.85));
    display:flex; align-items:center; justify-content:center;
    color: var(--accent-bright); cursor:pointer; box-shadow: var(--glow-strong); transition: color .2s, box-shadow .2s, transform .1s;
    position:relative;
  }
  .ptt:hover { color: var(--text); }
  .ptt::before, .ptt::after { content:''; position:absolute; inset:-10px; border-radius:50%; border:1px solid var(--accent); opacity:0; }
  .ptt.active { color: var(--text); box-shadow: 0 0 40px #6ec4ffcc, 0 0 90px #6ec4ff77; }
  .ptt.active::before { animation: ppulse 1.4s ease-out infinite; opacity:.85; }
  .ptt.active::after { animation: ppulse 1.4s ease-out infinite .5s; opacity:.6; }
  @keyframes ppulse { 0%{ transform:scale(1); opacity:.8;} 100%{ transform:scale(1.8); opacity:0;} }
  .ptt svg { width:24px; height:24px; }
  .ptt .rim { position:absolute; inset:-4px; border-radius:50%; border:1px dashed var(--accent-dim); animation: spin 22s linear infinite; }

  .status { display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:none; }
  .status .state { font-size:11px; color: var(--text-secondary); letter-spacing:.15em; min-height: 1.4em; transition: opacity .2s, color .2s; }
  .status .state.on { color: var(--accent-bright); }
  .status .mk { font-size:9px; letter-spacing:9px; color: var(--text-muted); }

  /* lateral waveform meter */
  .meter { display:flex; gap:2px; align-items:flex-end; height:20px; }
  .meter i { display:block; width:2px; background: var(--accent); box-shadow: var(--glow); animation: m 0.9s ease-in-out infinite; }
  .meter i:nth-child(1){animation-delay:-.6s} .meter i:nth-child(2){animation-delay:-.5s}
  .meter i:nth-child(3){animation-delay:-.4s} .meter i:nth-child(4){animation-delay:-.3s}
  .meter i:nth-child(5){animation-delay:-.2s} .meter i:nth-child(6){animation-delay:-.1s}
  .meter i:nth-child(7){animation-delay:0s}   .meter i:nth-child(8){animation-delay:-.15s}
  .meter i:nth-child(9){animation-delay:-.25s} .meter i:nth-child(10){animation-delay:-.35s}
  .meter i:nth-child(11){animation-delay:-.45s} .meter i:nth-child(12){animation-delay:-.55s}
  @keyframes m { 0%,100%{height:3px} 50%{height:20px} }

  /* hint key */
  .hint { position:fixed; bottom:16px; right: 16px; z-index:25; font-size:9px; letter-spacing:2px; color: var(--text-muted); text-transform:uppercase; }
  .hint kbd { border:1px solid var(--border); padding:2px 6px; margin: 0 2px; color: var(--accent); font-family: var(--font); font-size:9px; background: rgba(13,13,20,.6); }

  /* State simulator bar */
  .sim { position:fixed; left:50%; top: 60px; transform: translateX(-50%); z-index:28;
    display:flex; gap:6px; padding: 6px; background: rgba(13,13,20,.72); backdrop-filter: blur(14px);
    border:1px solid var(--border); border-radius:2px;
  }
  .sim::before, .sim::after { content:''; position:absolute; width:8px; height:8px; border-color: var(--accent); border-style:solid; }
  .sim::before { top:-2px; left:-2px; border-width:1px 0 0 1px;}
  .sim::after  { top:-2px; right:-2px; border-width:1px 1px 0 0;}
  .sim .lbl { font-size:8px; letter-spacing:2px; color: var(--text-muted); text-transform:uppercase; align-self:center; padding: 0 8px 0 6px; border-right: 1px dashed var(--border); margin-right: 2px; }
  .sim button {
    font-family: var(--font); font-size:9px; letter-spacing:1.5px; text-transform:uppercase;
    padding: 6px 10px; background: transparent; color: var(--text-secondary);
    border:1px solid var(--border); border-radius:2px; cursor:pointer; transition: all .18s;
    display:inline-flex; align-items:center; gap:6px;
  }
  .sim button:hover { color: var(--accent-bright); border-color: var(--accent); box-shadow: var(--glow); }
  .sim button.on { color: var(--bg); background: var(--accent); border-color: var(--accent); box-shadow: var(--glow); }
  .sim button.on.working { color: var(--bg); background: var(--warning); border-color: var(--warning); box-shadow: 0 0 8px #e8a84caa, 0 0 20px #e8a84c66; }
  .sim button .sd { width:6px; height:6px; border-radius:50%; background: currentColor; box-shadow: 0 0 4px currentColor; }

  /* Tweaks */
  .tweaks { position:fixed; right:14px; bottom:110px; width:260px; z-index:60; background: rgba(13,13,20,.92); backdrop-filter: blur(14px); border:1px solid var(--accent-dim); border-radius:2px; padding:14px; box-shadow: var(--glow); display:none; }
  .tweaks.open { display:block; animation: winIn .3s var(--ease) both; }
  .tweaks h3 { font-size:10px; letter-spacing:3px; text-transform:uppercase; margin:0 0 12px 0; color: var(--accent-bright); }
  .tweaks .f { margin-bottom:10px; }
  .tweaks .f label { font-size:8px; letter-spacing:1px; color: var(--text-secondary); text-transform:uppercase; display:flex; justify-content:space-between; margin-bottom:2px; }
  .tweaks .f .vv { color: var(--accent-bright); }
  .tweaks .f input[type=range] { width:100%; accent-color: var(--accent); }
  .tweaks .sw { display:flex; gap:6px; margin-top:4px; }
  .tweaks .sw b { display:block; width:24px; height:24px; border:1px solid var(--border); cursor:pointer; }
  .tweaks .sw b.on { border-color:#fff; box-shadow: var(--glow); }
  .tweaks .row { display:flex; justify-content: space-between; gap:8px; align-items:center; font-size:9px; letter-spacing:1px; color: var(--text-secondary); text-transform:uppercase; padding: 4px 0; border-top:1px dashed var(--border); }
  .tweaks .row .tg { width: 40px; height:18px; border:1px solid var(--border); border-radius:9px; position:relative; cursor:pointer; background: rgba(0,0,0,.4); }
  .tweaks .row .tg::after { content:''; position:absolute; top:1px; left:1px; width:14px; height:14px; background: var(--text-muted); border-radius:50%; transition: all .2s; }
  .tweaks .row .tg.on { border-color: var(--accent); }
  .tweaks .row .tg.on::after { left: 22px; background: var(--accent-bright); box-shadow: 0 0 6px var(--accent-bright); }

  /* idle mode dims panels */
  .app.idle .panel { opacity:.2; filter: blur(1px); pointer-events:none; transition: all .35s; }
  .app.idle .topbar { opacity: .45; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">

// ───────────────────────── tweak defaults ─────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "hue": 215,
  "glow": 74,
  "scan": true,
  "grid": true,
  "particles": true,
  "rings": true,
  "idleDim": true
}/*EDITMODE-END*/;

function useTweakApply(t) {
  React.useEffect(()=>{
    const r = document.documentElement;
    r.style.setProperty('--tweak-hue', t.hue);
    const l = 0.72, c = 0.14;
    r.style.setProperty('--accent',        `oklch(${l} ${c} ${t.hue})`);
    r.style.setProperty('--accent-bright', `oklch(${l + 0.1} ${c+0.02} ${t.hue})`);
    r.style.setProperty('--accent-speak',  `oklch(${l + 0.05} ${c+0.01} ${t.hue})`);
    r.style.setProperty('--accent-dim',    `oklch(${l - 0.2} ${c-0.04} ${t.hue})`);
    r.style.setProperty('--glow',          `0 0 ${6 + t.glow*0.1}px oklch(${l} ${c} ${t.hue} / ${0.4 + t.glow*0.005})`);
    r.style.setProperty('--glow-strong',   `0 0 ${12 + t.glow*0.2}px oklch(${l} ${c} ${t.hue} / ${0.5 + t.glow*0.005}), 0 0 ${28 + t.glow*0.3}px oklch(${l} ${c} ${t.hue} / ${0.25 + t.glow*0.003})`);
  }, [t]);
}

// ───────────────────────── scene ─────────────────────────
function Scene({ stars, grid }) {
  const starNodes = React.useMemo(() => {
    const arr = [];
    for (let i=0;i<60;i++) {
      arr.push({ left: Math.random()*100, top: Math.random()*100, delay: Math.random()*4 });
    }
    return arr;
  }, []);
  return (
    <div className="scene">
      {grid && <div className="grid"/>}
      <div className="scanlines"/>
      <div className="noise"/>
      <div className="horizon"/>
      <div className="stars">
        {stars && starNodes.map((s,i)=>(
          <i key={i} style={{left:s.left+'%', top:s.top+'%', animationDelay:s.delay+'s'}}/>
        ))}
      </div>
      <div className="vignette"/>
    </div>
  );
}

// ───────────────────────── orb ─────────────────────────
function Orb({ state, rings, particles }) {
  const ringTicks = React.useMemo(()=>Array.from({length:36}).map((_,i)=>i), []);
  const particleNodes = React.useMemo(()=>[
    { r:180, dur:10, size:3, col:'--accent-bright' },
    { r:210, dur:14, size:2, col:'--accent' },
    { r:240, dur:16, size:2, col:'--accent-bright' },
    { r:265, dur:20, size:3, col:'--accent' },
    { r:295, dur:24, size:2, col:'--accent-speak' },
    { r:330, dur:28, size:3, col:'--accent-bright' },
  ], []);

  const [tick, setTick] = React.useState(0);
  React.useEffect(()=>{
    let raf;
    const loop = (t)=> { setTick(t/1000); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);

  return (
    <div className="orb-wrap">
      {rings && (<>
        <div className="ring r5"/>
        <div className="ring r4"/>
        <div className="ring r3"/>
        <div className="ring r2"/>
        <div className="ring-ticks">
          {ringTicks.map(i => (
            <i key={i} style={{ transform: `translateX(-50%) rotate(${i*10}deg)` }}/>
          ))}
        </div>
        <div className="ring r1"/>
      </>)}

      <div className={`orb state-${state}`}/>
      <div className="pulse d1"/>
      <div className="pulse d2"/>
      <div className="pulse d3"/>

      {particles && particleNodes.map((p, i) => {
        const dir = i%2===0 ? 1 : -1;
        const ang = (tick * (2*Math.PI) / p.dur) * dir + i * 1.05;
        const x = Math.cos(ang) * p.r;
        const y = Math.sin(ang) * p.r;
        return (
          <span key={i} className="particle"
                style={{
                  width:p.size, height:p.size,
                  background: `var(${p.col})`,
                  boxShadow: `0 0 ${p.size*3}px var(${p.col})`,
                  transform: `translate(${x}px, ${y}px)`
                }}/>
        );
      })}
    </div>
  );
}

// ───────────────────────── top bar ─────────────────────────
function TopBar({ idle, onIdle, onTweaks, onSettings, now }) {
  const dateStr = now.toLocaleDateString('de-DE', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
  const timeStr = now.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  return (
    <div className="topbar">
      <span className="c-bl"/><span className="c-br"/>
      <span className="trace"><i className="l"/><i className="r"/></span>
      <div className="infobar">
        <span className="tag"><span className="dot"/>LINK · SECURE</span>
        <span className="sep">◆</span>
        <span className="t">{timeStr}</span>
        <span className="sep">·</span>
        <span className="d">{dateStr}</span>
        <span className="sep">·</span>
        <span className="w"><span className="g">☁</span> 14°C · Wien</span>
        <span className="sep">·</span>
        <span className="d">N 48.21 · E 16.37</span>
      </div>
      <div className="brand"><b>J</b> A R V I S <span style={{color:'var(--accent-dim)'}}>/ MK XLII</span></div>
      <div className="tb-right">
        <button className={`ibtn ${idle?'on':''}`} onClick={onIdle} title="Idle mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2"/></svg>
        </button>
        <button className="ibtn" title="Reset layout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button className="ibtn" onClick={onTweaks} title="Tweaks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.2 4.2l2.8 2.8M17 17l2.8 2.8M2 12h4M18 12h4M4.2 19.8L7 17M17 7l2.8-2.8"/></svg>
        </button>
        <button className="ibtn" onClick={onSettings} title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="5" cy="6" r="1.5"/><path d="M8 6h13M3 12h9M15 12h6M3 18h5M11 18h10"/><circle cx="13" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/></svg>
        </button>
      </div>
    </div>
  );
}

// ───────────────────────── panels ─────────────────────────
function Panel({ ix, title, badge, style, focused, onFocus, children }) {
  return (
    <div className={`panel${focused?' focused':''}`} style={style} onMouseDown={onFocus}>
      <span className="ck tl"/><span className="ck tr"/><span className="ck bl"/><span className="ck br"/>
      <span className="rail l"/><span className="rail r"/>
      <span className="trace"><i className="l"/><i className="r"/></span>
      <div className="hdr">
        <span className="ix">{ix}</span>
        <span className="tt">{title}</span>
        <span className="dots"><i/><i/><i/></span>
        {badge && <span className="badge">{badge}</span>}
      </div>
      <div className="body">{children}</div>
    </div>
  );
}

// Sparkline
function Spark({ values, color, warn }) {
  const w = 100, h = 28;
  const max = Math.max(...values, 100);
  const step = w / (values.length-1);
  const pts = values.map((v,i) => `${(i*step).toFixed(1)},${(h - (v/max)*h).toFixed(1)}`);
  const line = `M ${pts.join(' L ')}`;
  const area = `${line} L ${w},${h} L 0,${h} Z`;
  const c = warn ? 'var(--warning)' : color;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <defs>
        <linearGradient id={`g-${color.replace(/[^a-z]/gi,'')}-${warn?'w':'n'}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={c} stopOpacity="0.5"/>

function SystemPanel({ focused, onFocus }) {
  const [tick, setTick] = React.useState(0);
  React.useEffect(()=>{ const id = setInterval(()=>setTick(t=>t+1), 1400); return ()=>clearInterval(id); }, []);
  const tiles = React.useMemo(()=>{
    const mk = (base, n=24) => Array.from({length:n}, (_,i) => {
      const t = (tick*6 + i*11) * 0.37;
      return Math.max(4, Math.min(100, base + Math.sin(t)*12 + Math.cos(t*1.7)*6 + (Math.random()-.5)*4));
    });
    return [
      {id:'cpu', label:'CPU', unit:'%', val: 38 + (tick%7), hist: mk(38)},
      {id:'ram', label:'RAM', unit:'%', val: 62 + (tick%5), hist: mk(62)},
      {id:'gpu', label:'GPU', unit:'%', val: 21 + (tick%4), hist: mk(20)},
      {id:'cpuTemp', label:'CPU TEMP', unit:'°C', val: 84 + (tick%3), hist: mk(82), warn:true},
      {id:'net', label:'NET', unit:'Mb/s', val: (12.3 + Math.sin(tick)*2).toFixed(1), hist: mk(40), sub:'↑ 0.8 Mb/s'},
      {id:'disk', label:'DISK', unit:'%', val: 47, hist: mk(47)},
    ];
  }, [tick]);
  return (
    <Panel ix="◈" title="System Vitals · live" badge="LIVE" focused={focused} onFocus={onFocus}
           style={{ left:24, top:66, width: 316, height: 300 }}>
      <div className="tiles">

            <div key={t.id} className={`tile ${warn?'warn':''}`}>

// ───────────────────────── app ─────────────────────────
const JARVIS_REPLIES = [
  'Certainly, sir. Stand by.',
  'Acknowledged. I will keep you posted.',
  'Workshop two is ready for you.',
  'Miss Potts ist auf Leitung eins — soll ich durchstellen?',
  'Holographic projection primed.',
  'Das Reaktor-Interface ist stabil, Sir.',
];
const USER_PROMPTS = [
  'Was steht heute an?',
  'Spiel etwas AC/DC.',
  'Dim the lights in the living room to 40 percent.',
  'Wie ist der Status vom Reaktor?',
  'Call Pepper.',
];

function App() {
  const [state, setState] = React.useState('idle');
  const [idle, setIdle] = React.useState(false);
  const [turns, setTurns] = React.useState(INITIAL_TURNS);
  const [focused, setFocused] = React.useState('transcript');
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [now, setNow] = React.useState(new Date());

  useTweakApply(tweaks);

  React.useEffect(()=>{ const id = setInterval(()=>setNow(new Date()), 1000); return ()=>clearInterval(id); }, []);

  // edit-mode protocol
  React.useEffect(()=>{
    const h = (ev) => {
      if (!ev.data) return;
      if (ev.data.type==='__activate_edit_mode') setTweaksOpen(true);
      if (ev.data.type==='__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', h);
    window.parent.postMessage({type:'__edit_mode_available'}, '*');
    return ()=>window.removeEventListener('message', h);
  }, []);
  React.useEffect(()=>{
    window.parent.postMessage({type:'__edit_mode_set_keys', edits: tweaks}, '*');
  }, [tweaks]);

  const runPTT = () => {
    if (state !== 'idle') { setState('idle'); return; }
    setState('listening');
    const q = USER_PROMPTS[Math.floor(Math.random()*USER_PROMPTS.length)];
    setTimeout(()=>{
      const t = new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
      setTurns(ts => [...ts, {id: Date.now(), role:'user', time:t, text:q}]);
      setState('thinking');
      setTimeout(()=>{
        const r = JARVIS_REPLIES[Math.floor(Math.random()*JARVIS_REPLIES.length)];
        setTurns(ts => [...ts, {id: Date.now()+1, role:'jarvis', time:t, text:r}]);
        setState('speaking');
        setTimeout(()=>setState('idle'), 2000);
      }, 1300);
    }, 1500);
  };

  React.useEffect(()=>{
    const onKey = (e) => {
      if (e.code==='Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); runPTT(); }
      if (e.ctrlKey && e.key==='.') { e.preventDefault(); setIdle(x=>!x); }
    };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  }, [state]);

  const appClass = `app${idle && tweaks.idleDim?' idle':''}${state==='working'?' is-working':''}`;

  return (
    <div className={appClass} style={{position:'fixed', inset:0}}>
      <Scene stars grid={tweaks.grid}/>
      <div className="reactor"/>
      <Orb state={state} rings={tweaks.rings} particles={tweaks.particles}/>

      {tweaks.scan && <div style={{position:'fixed', inset:0, pointerEvents:'none', background:'repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(110,196,255,0.035) 2px, rgba(110,196,255,0.035) 3px)', mixBlendMode:'screen', zIndex:4}}/>}

      <span className="hud-corner tl"/><span className="hud-corner tr"/>
      <span className="hud-corner bl"/><span className="hud-corner br"/>

      <TopBar idle={idle} onIdle={()=>setIdle(x=>!x)} onTweaks={()=>setTweaksOpen(x=>!x)} onSettings={()=>{}} now={now}/>

      <StateSim state={state} setState={setState}/>

      <SystemPanel        focused={focused==='sys'}   onFocus={()=>setFocused('sys')}/>
      <NowPlayingPanel    focused={focused==='np'}    onFocus={()=>setFocused('np')}/>
      <LightsPanel        focused={focused==='lt'}    onFocus={()=>setFocused('lt')}/>
      <AgendaPanel        focused={focused==='ag'}    onFocus={()=>setFocused('ag')}/>
      <MailPanel          focused={focused==='ml'}    onFocus={()=>setFocused('ml')}/>
      <GitlabPanel        focused={focused==='gl'}    onFocus={()=>setFocused('gl')}/>
      <TranscriptPanel    focused={focused==='transcript'} onFocus={()=>setFocused('transcript')} turns={turns} state={state}/>
      <NotificationsPanel focused={focused==='nf'}    onFocus={()=>setFocused('nf')}/>

      <Dock state={state} onPTT={runPTT}/>

      <div className="hint">PUSH TO TALK · <kbd>SPACE</kbd>   IDLE · <kbd>CTRL+.</kbd></div>

      <Tweaks open={tweaksOpen} tweaks={tweaks} setTweaks={setTweaks}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
