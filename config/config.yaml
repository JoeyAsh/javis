jarvis:
  name: "JARVIS"
  wake_word: "hey jarvis"
  language: "auto"

voice_composer:
  max_sentence_words: 50
  long_sentence_mode: "split"   # "split" | "truncate"
  salutation_policy: "sir_only"

device_ledger:
  db_path: "state/device_ledger.db"
  broadcast_interval_seconds: 30
  wal_mode: true

location:
  latitude: 48.7758
  longitude: 9.1829

audio:
  input_device_index: null
  sample_rate: 16000
  chunk_size: 1024
  silence_threshold: 300
  silence_duration_ms: 2000  # End-of-utterance threshold. 1500ms still cut natural thinking pauses mid-sentence ("…von meinem Jetz,"); 2000ms gives 500ms more grace. Backchannel at 1200ms still fires inside the pause window.

stt:
  model: "small"
  device: "cpu"
  compute_type: "int8"
  # Whisper language hint. "auto" lets Whisper detect the spoken language
  # per utterance; JARVIS' response is then wrapped with a "[respond in X]"
  # hint so the reply mirrors the user's language. Pin to a specific ISO
  # code (``"de"``, ``"en"``, ...) only if Whisper keeps drifting to exotic
  # languages on ambiguous audio.
  language: "auto"

tts:
  engine: "fish"          # Fish Audio cloud TTS

wake_word:
  model_path: null
  threshold: 0.3
  vad_threshold: 0.5

claude:
  model: "claude-sonnet-4-6"
  max_tokens: 300
  temperature: 0.7
  max_history_turns: 10

agents:
  orchestrator_model: "claude-opus-4-7"
  subagent_model: "claude-sonnet-4-6"
  orchestrator_max_tokens: 150
  chat_max_tokens: 300
  action_max_tokens: 100
  skip_orchestrator_on_clear_intent: true
  history_turns_for_chat: 10
  history_turns_for_orchestrator: 3

pc_control:
  enabled: true
  platform: "auto"

smart_home:
  enabled: false

api:
  # Bind address for WS (:8765) and HTTP (:8766) servers.
  # Default is loopback — safe for a personal assistant with no auth layer.
  # Set to "0.0.0.0" only when you need LAN/WAN access AND have added auth.
  # Env-switch alternative (chosen over a new config key to keep the surface
  # minimal): set JARVIS_REMOTE_ACCESS=true in .env to flip from 127.0.0.1 to
  # 0.0.0.0 at startup without touching this file.  Tailscale ACL is then the
  # auth boundary.  An explicit value here ALWAYS overrides the env switch.
  # Note: setting `host: "127.0.0.1"` here does NOT prevent `JARVIS_REMOTE_ACCESS=true`
  # from flipping to 0.0.0.0 — the env switch wins when the config value is the
  # default loopback.  If you need to enforce loopback regardless of env, ensure
  # `JARVIS_REMOTE_ACCESS` is unset in the environment, or pin a non-default
  # loopback alias such as `host: "127.0.0.2"` which will be used verbatim.
  host: "127.0.0.1"
  # Allowed CORS origins for the HTTP server.  Each entry can be:
  #   - A literal origin:            "http://localhost:5173"
  #   - A wildcard (allow all):      "*"
  #   - An fnmatch-style glob:       "https://*.tailnet.ts.net:5173"
  # Wildcards supported (fnmatch): "https://*.tailnet.ts.net:5173" matches any
  # tailnet subdomain on port 5173, e.g. "https://laptop-paps.tailnet.ts.net:5173".
  # Patterns must include the port for non-default ports — fnmatch's `*` does
  # not cross `:` boundaries by convention.
  cors_origins:
    - "http://localhost:5173"
    - "http://*.tail77bd3b.ts.net:5173"
    - "https://*.tail77bd3b.ts.net:5173"

logging:
  level: "DEBUG"
  file: "logs/jarvis.log"

memory:
  enabled: true
  db_path: "data/jarvis.db"
  backup:
    enabled: true
    directory: "data/backups"
    keep_days: 14
    schedule: "0 3 * * *"  # 3 AM daily (cron format)

mcp:
  # MCP server exposes JARVIS-native tools (Spotify, HA, PC control, …) to the
  # OpenClaw agent runtime over SSE transport.  Phase 3: infrastructure only —
  # no tools registered until Phase 4 (#76) + Spotify (#58).
  enabled: true
  bind_host: "127.0.0.1"
  bind_port: 8767
  # advertise_host: null means use bind_host for the SSE URL registered with
  # OpenClaw.  Set to a Tailscale IP or MagicDNS hostname (e.g.
  # "laptop-paps.tailnet.ts.net") when OpenClaw must reach this JARVIS instance
  # over the tailnet from a different machine.
  # Resolution order (highest priority first):
  #   1. JARVIS_MCP_ADVERTISE_HOST env var — highest priority override.
  #   2. This config key (advertise_host) when set and not null.
  #   3. Auto-detect from TAILSCALE_HOSTNAME env var or `tailscale status --json`
  #      (parses Self.DNSName; 2-second timeout; silent no-op if Tailscale is
  #      not installed or the daemon is not running).
  #   4. bind_host fallback.
  advertise_host: null
  # openclaw_headers: optional HTTP headers forwarded to the OpenClaw MCP
  # registry entry (openclaw mcp set <name> '{"url": "...", "headers": {...}}').
  # Use when the operator wants an extra static bearer token; Tailscale-only
  # deployments can leave this empty (Tailscale ACL is the auth boundary).
  openclaw_headers: {}
  # When true, JARVIS registers itself with the local OpenClaw CLI registry
  # at startup (openclaw mcp set jarvis-{slug} ...) and removes the entry on
  # shutdown.  Set to false when OpenClaw is fully remote and CLI is unavailable.
  auto_register_with_openclaw: true

openclaw:
  enabled: true
  # For remote OpenClaw via Tailscale, use the gateway host's tailnet URL,
  # e.g. "http://100.84.x.y:18789". For local OpenClaw, use "http://127.0.0.1:18789".
  # Do NOT change this to a Tailscale URL here — update your own tailnet IP.
  gateway_url: "http://127.0.0.1:18789"
  gateway_port: 18789
  managed_daemon: false  # true = JARVIS starts/stops daemon; false = assume systemd
  health_check_interval_seconds: 30
  # session_id is per-device required for multi-device setups.  Each JARVIS
  # instance must use a distinct value so conversation histories are isolated.
  # If absent, JARVIS derives "jarvis-{device_slug}" at startup and logs an
  # INFO line prompting the operator to pin it here.  Existing values such as
  # "jarvis-main" are respected verbatim — no migration needed.
  session_id: "jarvis-main"
  # OpenClaw CLI thinking levels: off | minimal | low | medium | high | xhigh.
  # Legacy aliases ("normal" -> "medium", "none" -> "off") are also accepted.
  thinking_level: "medium"
  timeout_seconds: 120
  # Model used by OpenClaw's agent runtime (replaces the direct Anthropic
  # SDK path). The OpenClaw gateway owns auth via `claude login` — JARVIS
  # just tells it which model to invoke. Valid values follow OpenClaw's
  # `<provider>/<model-id>` convention (e.g. "claude-cli/claude-opus-4-7",
  # "anthropic/claude-sonnet-4-6"). Leave blank to use OpenClaw's default.
  agent_model: "claude-cli/claude-opus-4-7"
  # Persistent WebSocket streaming — eliminates ~3.7s subprocess startup per turn.
  # Set to false to fall back to subprocess mode (slower but no WS dependency).
  streaming_enabled: true
  # Maximum backoff cap in seconds for WS auto-reconnect.
  ws_reconnect_max_seconds: 30
  # Patience before the first token arrives (covers thinking + tool-calls).
  stream_time_to_first_token_seconds: 60
  # Patience between deltas after streaming has begun.
  stream_inter_delta_timeout_seconds: 20

spotify:
  enabled: true
  # Seconds between playback-state polls. Lower values give snappier HUD
  # updates but cost more Spotify API quota.
  poll_interval: 10
  # Path where the PKCE token is cached. Tilde is expanded at runtime.
  # Override with SPOTIFY_TOKEN_CACHE env var.
  token_cache_path: "~/.jarvis/spotify_token.json"
  # Set to a Spotify Connect device name or ID to force a default device;
  # null lets the API return the currently active device.
  default_device: null
  # OAuth scopes required by the integration.
  # Note: user-read-currently-playing is implicit in user-read-playback-state;
  # requesting both causes Spotify to return only the broader one, triggering
  # a scope-mismatch re-auth loop in spotipy. Keep these two only.
  scopes:
    - "user-read-playback-state"
    - "user-modify-playback-state"
    - "playlist-read-private"
    - "playlist-read-collaborative"
    - "user-library-read"
    - "streaming"
    - "user-read-email"
    - "user-read-private"

github:
  # Token-gated: requires GITHUB_TOKEN in .env (classic PAT, scopes
  # repo read + read:org). If the token is missing the poller does NOT
  # start regardless of this flag. Set repos to the list you want tracked.
  # NOTE: our current client uses the /search/issues endpoint (30 req/h
  # hard cap). 180 s = 20 ticks/h = fits the search quota with breathing
  # room. Planned refactor (see .tmp/features/openclaw-dedup-analysis.md
  # Tier 1.5) will replace this with the OpenClaw `github` skill over
  # the `gh` CLI, which uses the 5000 req/h Core-API.
  enabled: true
  poll_interval_seconds: 180
  repos:
    - "JoeyAsh/javis"
  # Add more repos by extending this list:
  #   - "owner/repo-a"
  #   - "owner/repo-b"

gitlab:
  # Token-gated: requires GITLAB_TOKEN in .env (personal access token with
  # api + read_repository scopes). If the token is missing the poller does
  # NOT start regardless of this flag.
  # GITLAB_URL env var overrides the url key below (useful for self-hosted).
  enabled: true
  url: "https://gitlab.com"
  poll_interval_seconds: 60
  # List of "group/project" slugs or numeric project IDs to watch pipelines
  # for. Slugs with "/" are URL-encoded automatically; bare integers are
  # treated as numeric IDs.
  projects: []
  # Add projects by extending this list:
  #   - "my-group/my-project"
  #   - "42"

google:
  # DEPRECATED (ADR-0001): JARVIS no longer owns a Google token cache.
  # Auth is managed exclusively by the gog CLI on the OpenClaw host:
  #   gog auth add you@gmail.com --services gmail,calendar,drive
  # The keys below are retained as documentation only and are NOT read by
  # any active code path.
  token_cache_path: "~/.jarvis/google_token.json"  # deprecated
  timeout_seconds: 120                              # deprecated

calendar:
  enabled: true
  # Google account email for gog CLI (gog --account). Leave null to use
  # the default account from `gog auth list`.
  account: null
  # Timeout for gog subprocess calls in seconds.
  gog_timeout_seconds: 30
  poll_interval_seconds: 60
  lookahead_hours: 48
  max_events_per_query: 20
  default_event_duration_minutes: 60
  op_confirm_timeout_seconds: 60
  reminder_thresholds_minutes:
    - 10
    - 5
    - 1
  # scopes below are deprecated — gog auth add manages scopes on the OpenClaw host
  scopes:
    - "https://www.googleapis.com/auth/calendar"
    - "https://www.googleapis.com/auth/calendar.events"

drive:
  enabled: true
  # Google account email for gog CLI (gog --account). Leave null to use
  # the default account from `gog auth list`.
  account: null
  # Timeout for gog subprocess calls in seconds.
  gog_timeout_seconds: 30
  max_results: 10
  preview_content_chars: 500
  # scopes below are deprecated — gog auth add manages scopes on the OpenClaw host
  scopes:
    - "https://www.googleapis.com/auth/drive.readonly"

log_panel:
  # Live backend log stream + turn-timeline waterfall in the HUD. Server
  # maintains a ring buffer of recent log lines that is replayed when a
  # new WS client connects. Set enabled: false to disable the broadcast.
  enabled: true
  max_buffer_lines: 500

gmail:
  enabled: true
  # Google account email for gog CLI (gog --account). Leave null to use
  # the default account from `gog auth list`. Set via GOG_ACCOUNT env var
  # or here explicitly: account: "you@gmail.com"
  account: null
  # Timeout for gog subprocess calls in seconds.
  gog_timeout_seconds: 30
  max_unread_summary: 5
  poll_interval_seconds: 120
  send_confirm_timeout_seconds: 60  # per authorized decision: 60s per-connection timeout
  vip_senders: []
  # scopes below are deprecated — gog auth add manages scopes on the OpenClaw host
  scopes:
    - "https://www.googleapis.com/auth/gmail.readonly"
    - "https://www.googleapis.com/auth/gmail.send"

briefing:
  enabled: true
  timezone: "Europe/Zurich"
  weather:
    provider: "open-meteo"
    location:
      lat: 47.37
      lon: 8.54
  commute:
    from: ""
    to: ""
    mode: "auto"
  news:
    source: "https://www.srf.ch/news/bnf/rss/1646"
    max_items: 3
  mail:
    max_items: 3
    vip_domains: []

greeting:
  enabled: true
  delay_seconds: 0.8         # wait for HUD to finish subscribing
  mode: "status"             # "static" | "status" — status uses runtime data

persona:
  enabled: true
  salutation_mode: "random"  # "random" | "fixed"
  salutation_pool:
    - "Sir"
    - "Johannes"
  salutation_weights: [0.5, 0.5]  # must sum to 1.0
  salutation_seed: null  # optional: integer seed for reproducibility
  salutation_override: null  # set to force specific salutation
  default_language: "de"   # used by the online greeting and any other persona-aware utterances
  style: "jarvis"
  language_style:
    en: british_formal
    de: formal_sie

proactive:
  enabled: true
  interjection_cooldown_seconds: 300  # 5 minutes between interjections
  triggers:
    meeting_reminder:
      enabled: true
      advance_minutes: 10
      voice: true
    dirty_repo:
      enabled: true
      idle_hours: 2
      voice: false  # notification only
    system_alert:
      enabled: true
      cpu_threshold: 85
      ram_threshold: 90
      disk_threshold: 95
      voice: true
    vip_mail:
      enabled: true
      sender_whitelist: []
      voice: true
    late_night_reminder:
      enabled: false
      after_hour: 23
      voice: true

voice:
  # Conversation mode — keep the mic open for a follow-up window after every
  # voice turn so the user can continue speaking without repeating the wake
  # word. Natural "sleep" phrases ("danke", "thanks", ...) close the session
  # with a short closing line. The default phrase lists live in
  # ``src/brain/conversation_mode.py``; overrides can be added here.
  conversation_mode:
    enabled: true
    follow_up_window_seconds: 18
    # sleep_phrases / closing_phrases default lists live in code; override here if desired.

  # Latency targets
  first_audio_target_ms: 1000
  p90_latency_target_ms: 2000

  # Streaming
  sentence_split_min_chars: 20
  sentence_split_max_wait_ms: 500
  tts_queue_size: 3

  # Barge-in
  barge_in_enabled: true
  barge_in_sensitivity_ms: 300  # 300ms is the sweet spot — 150ms triggered on breath/keys, 400ms missed real "stopp"/"moment" interrupts.
  barge_in_vad_rms_threshold: 0.003  # Measured from live logs: user's speech peaks at ~0.005 RMS, silence stays at <0.0005. 0.003 catches speech reliably while ignoring ambient noise. Was 0.02 (far too high for this mic gain).

  # Backchannels
  backchannels_enabled: true
  backchannel_silence_threshold_ms: 1200
  backchannel_volume: 0.3
  backchannel_min_interval_seconds: 3

  # Fillers
  thinking_filler_enabled: true
  thinking_filler_delay_ms: 800

  # Quick ack
  quick_ack_enabled: true
  quick_ack_target_ms: 400

  # Prosody
  prosody_context_aware: true
  prosody_enabled: true

  # Disfluencies (opt-in)
  natural_disfluencies: false
  disfluency_rate: 0.1
  disfluency_phrases:
    de: ["also", "nun"]
    en: ["well", "so"]
  disfluencies_enabled: false
  disfluency_probability: 0.2

  # Phrase-cache stats log interval
  cache_stats_log_interval_seconds: 300

  # Response length
  default_response_sentences: 2
  detail_mode_sentences: 5

  # Token efficiency
  system_prompt_max_tokens: 500
  history_full_turns: 5
  history_summarized_turns: 10
  response_cache_ttl_seconds: 60
  response_cache_max_size: 100

  # Turn detection
  silence_threshold_ms: 2000  # DEAD CONFIG — never read in Python. Live end-of-utterance is audio.silence_duration_ms (currently 2000). Kept here for documentation parity only.
  # NOTE: silence_threshold_ms is NOT read by the production ws_server.py pipeline.
  # The live end-of-utterance duration is audio.silence_duration_ms (currently 1500ms).
  # This key is preserved here for documentation and future wiring.
  use_prosodic_hints: false

  # Phrase cache
  cache_directory: "data/voice_cache"

narration:
  enabled: true
  update_voice: false
  urgent_max_wait_seconds: 30
  completion_batch_seconds: 10
  per_source_rate_limit:
    items: 6
    window_seconds: 60
  quiet_mode_default_minutes: 60
  ducking:
    spotify_factor: 0.25
    sfx_factor: 0.12
    chime_factor: 0.35
    ramp_down_ms: 200
    ramp_up_ms: 400
    tail_silence_ms: 500

notifications:
  wife:
    enabled: true
    sender_id: "+41765005527"
    # Model used to synthesize the announcement text (not the TTS audio).
    # Defaults to sonnet for cost/latency; opus is only needed if persona fidelity matters.
    announcement_model: "claude-sonnet-4-6"
    max_body_chars: 200
    fallback_text: "Sir, Ihre Frau hat Ihnen eine Nachricht geschickt."
