<!doctype html>
<html><head><meta charset="utf-8"><title>Sparkline &amp; Bars</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  .wrap{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .tile{border:1px solid var(--border);padding:10px 12px;border-radius:2px;background:rgba(13,13,20,.75)}
  .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .lbl{font-size:9px;letter-spacing:1px;color:var(--text-secondary);text-transform:uppercase}
  .val{font-size:13px;color:var(--accent-bright);font-variant-numeric:tabular-nums}
  .val small{font-size:9px;color:var(--text-muted);margin-left:2px}
  .bar{height:2px;background:var(--border);margin-top:8px;overflow:hidden}
  .bf{height:100%;background:var(--accent);box-shadow:var(--glow)}
  .warn{color:var(--warning)!important}
</style></head>
<body><div class="wrap">
  <div class="tile">
    <div class="head"><span class="lbl">CPU</span><span class="val">42<small>%</small></span></div>
    <svg viewBox="0 0 100 24" preserveAspectRatio="none" style="width:100%;height:24px;display:block">
      <path d="M0,18 L10,16 L20,14 L30,12 L40,14 L50,10 L60,8 L70,11 L80,6 L90,9 L100,5" stroke="#6ec4ff" stroke-width="1.2" fill="none"/>
      <path d="M0,18 L10,16 L20,14 L30,12 L40,14 L50,10 L60,8 L70,11 L80,6 L90,9 L100,5 L100,24 L0,24 Z" fill="#6ec4ff" opacity=".15"/>
    </svg>
  </div>
  <div class="tile">
    <div class="head"><span class="lbl">CPU TEMP</span><span class="val warn">87<small>°C</small></span></div>
    <svg viewBox="0 0 100 24" preserveAspectRatio="none" style="width:100%;height:24px;display:block">
      <path d="M0,14 L10,13 L20,11 L30,12 L40,9 L50,7 L60,5 L70,4 L80,3 L90,2 L100,1" stroke="#e8b24c" stroke-width="1.2" fill="none"/>
      <path d="M0,14 L10,13 L20,11 L30,12 L40,9 L50,7 L60,5 L70,4 L80,3 L90,2 L100,1 L100,24 L0,24 Z" fill="#e8b24c" opacity=".18"/>
    </svg>
  </div>
  <div class="tile" style="grid-column:1/3">
    <div class="head"><span class="lbl">NOW PLAYING · PROGRESS</span><span class="val" style="font-size:10px">1:42 / 3:58</span></div>
    <div class="bar" style="margin-top:6px"><div class="bf" style="width:42%"></div></div>
    <div class="bar" style="margin-top:4px"><div class="bf" style="width:70%;background:var(--accent-bright)"></div></div>
    <div class="bar" style="margin-top:4px"><div class="bf" style="width:20%"></div></div>
  </div>
</div></body></html>
