jarvis:
  name: "JARVIS"
  wake_word: "hey jarvis"
  language: "auto"

audio:
  input_device_index: null
  sample_rate: 16000
  chunk_size: 1024
  silence_threshold: 300
  silence_duration_ms: 1500

stt:
  model: "small"
  device: "cpu"
  compute_type: "int8"
  language: null

tts:
  engine: "fish"          # Fish Audio cloud TTS

wake_word:
  model_path: null
  threshold: 0.3
  vad_threshold: 0.5

claude:
  model: "claude-sonnet-4-6"
  max_tokens: 300
  temperature: 0.7
  max_history_turns: 10

agents:
  orchestrator_model: "claude-opus-4-5"
  subagent_model: "claude-sonnet-4-6"
  orchestrator_max_tokens: 150
  chat_max_tokens: 300
  action_max_tokens: 100
  skip_orchestrator_on_clear_intent: true
  history_turns_for_chat: 10
  history_turns_for_orchestrator: 3

pc_control:
  enabled: true
  platform: "auto"

smart_home:
  enabled: false

api:
  cors_origins: ["http://localhost:5173"]

logging:
  level: "DEBUG"
  file: "logs/jarvis.log"

memory:
  enabled: true
  db_path: "data/jarvis.db"
  backup:
    enabled: true
    directory: "data/backups"
    keep_days: 14
    schedule: "0 3 * * *"  # 3 AM daily (cron format)
