version: "3.9"
services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile.rpi
    env_file: .env
    volumes:
      - ./config:/app/config
      - ./voices:/app/voices
      - ./logs:/app/logs
    devices:
      - /dev/snd:/dev/snd
    environment:
      - JARVIS_PLATFORM=rpi
      - JARVIS_REMOTE_ACCESS=${JARVIS_REMOTE_ACCESS:-}
      - TAILSCALE_HOSTNAME=${TAILSCALE_HOSTNAME:-}
      - JARVIS_MCP_ADVERTISE_HOST=${JARVIS_MCP_ADVERTISE_HOST:-}
    network_mode: host
    restart: unless-stopped
