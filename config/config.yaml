jarvis:
  name: "JARVIS"
  wake_word: "hey jarvis"
  language: "auto"

audio:
  input_device_index: null
  sample_rate: 16000
  chunk_size: 1024
  silence_threshold: 300
  silence_duration_ms: 1500

stt:
  model: "small"
  device: "cpu"
  compute_type: "int8"
  language: null

tts:
  engine: "fish"          # Fish Audio cloud TTS

wake_word:
  model_path: null
  threshold: 0.3
  vad_threshold: 0.5

claude:
  model: "claude-sonnet-4-6"
  max_tokens: 300
  temperature: 0.7
  max_history_turns: 10

agents:
  orchestrator_model: "claude-opus-4-5"
  subagent_model: "claude-sonnet-4-6"
  orchestrator_max_tokens: 150
  chat_max_tokens: 300
  action_max_tokens: 100
  skip_orchestrator_on_clear_intent: true
  history_turns_for_chat: 10
  history_turns_for_orchestrator: 3

pc_control:
  enabled: true
  platform: "auto"

smart_home:
  enabled: false

api:
  cors_origins: ["http://localhost:5173"]

logging:
  level: "DEBUG"
  file: "logs/jarvis.log"

memory:
  enabled: true
  db_path: "data/jarvis.db"
  backup:
    enabled: true
    directory: "data/backups"
    keep_days: 14
    schedule: "0 3 * * *"  # 3 AM daily (cron format)

openclaw:
  enabled: true
  gateway_url: "http://127.0.0.1:18789"
  gateway_port: 18789
  managed_daemon: false  # true = JARVIS starts/stops daemon; false = assume systemd
  health_check_interval_seconds: 30
  session_id: "jarvis-main"
  thinking_level: "normal"  # "none" | "normal" | "high"
  timeout_seconds: 30

persona:
  enabled: true
  salutation_mode: "random"  # "random" | "fixed"
  salutation_pool:
    - "Sir"
    - "Johannes"
  salutation_weights: [0.5, 0.5]  # must sum to 1.0
  salutation_seed: null  # optional: integer seed for reproducibility
  salutation_override: null  # set to force specific salutation
  style: "jarvis"
  language_style:
    en: british_formal
    de: formal_sie

proactive:
  enabled: true
  interjection_cooldown_seconds: 300  # 5 minutes between interjections
  triggers:
    meeting_reminder:
      enabled: true
      advance_minutes: 10
      voice: true
    dirty_repo:
      enabled: true
      idle_hours: 2
      voice: false  # notification only
    system_alert:
      enabled: true
      cpu_threshold: 85
      ram_threshold: 90
      disk_threshold: 95
      voice: true
    vip_mail:
      enabled: true
      sender_whitelist: []
      voice: true
    late_night_reminder:
      enabled: false
      after_hour: 23
      voice: true
