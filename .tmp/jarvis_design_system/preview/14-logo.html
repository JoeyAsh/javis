<!doctype html>
<html><head><meta charset="utf-8"><title>Logo / Favicon</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  .wrap{padding:22px;display:flex;align-items:center;gap:22px}
  .fav{width:96px;height:96px;border:1px solid var(--border);background:#050508}
  .col{display:flex;flex-direction:column;gap:6px}
  .mark{font-size:30px;letter-spacing:14px;color:var(--text);font-weight:500}
  .sub{font-size:9px;color:var(--text-muted);letter-spacing:3px;text-transform:uppercase}
  .tag{font-size:10px;color:var(--text-secondary);letter-spacing:1px;max-width:320px;line-height:1.5}
</style></head>
<body><div class="wrap">
  <img src="../assets/favicon.svg" alt="JARVIS mark" class="fav"/>
  <div class="col">
    <div class="mark">JARVIS</div>
    <div class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
    <div class="tag">Radial blue glow on near-black. White-hot core at 8px, mid ring <code style="color:var(--accent-bright);font-size:9px">#4ca8e8</code>, outer falloff to bg.</div>
  </div>
</div></body></html>
