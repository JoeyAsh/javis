<!doctype html>
<html><head><meta charset="utf-8"><title>Orb states</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);overflow:hidden;}
  .wrap{padding:18px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:end}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
  .stage{width:100%;aspect-ratio:1/1;max-width:220px;position:relative;border:1px dashed var(--border);border-radius:2px;overflow:hidden;background:#000}
  .stage canvas{display:block;width:100%!important;height:100%!important}
  .stage::before,.stage::after{content:'';position:absolute;width:10px;height:10px;border:1px solid var(--accent);opacity:.6}
  .stage::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
  .stage::after{top:-1px;right:-1px;border-width:1px 1px 0 0}
  .bl,.br{position:absolute;width:10px;height:10px;border:1px solid var(--accent);opacity:.6}
  .bl{bottom:-1px;left:-1px;border-width:0 0 1px 1px}
  .br{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
  .lbl{font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase}
  .on{color:var(--accent-bright);text-shadow:0 0 6px var(--accent)}
  .tag{position:absolute;top:8px;left:10px;font-size:8px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;font-family:var(--font);z-index:2}
  .metric{position:absolute;top:8px;right:10px;font-size:8px;letter-spacing:1px;color:var(--accent);font-family:var(--font);font-variant-numeric:tabular-nums;z-index:2}
</style></head>
<body>
<div class="wrap">
  <div class="cell"><div class="stage" data-state="idle"><span class="tag">S-01</span><span class="metric">○ idle</span><span class="bl"></span><span class="br"></span></div><div class="lbl">idle</div></div>
  <div class="cell"><div class="stage" data-state="listening"><span class="tag">S-02</span><span class="metric">◉ rx</span><span class="bl"></span><span class="br"></span></div><div class="lbl on">listening</div></div>
  <div class="cell"><div class="stage" data-state="thinking"><span class="tag">S-03</span><span class="metric">⟳ proc</span><span class="bl"></span><span class="br"></span></div><div class="lbl on">thinking</div></div>
  <div class="cell"><div class="stage" data-state="speaking"><span class="tag">S-04</span><span class="metric">▸ tx</span><span class="bl"></span><span class="br"></span></div><div class="lbl on">speaking</div></div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
  const stages = document.querySelectorAll('.stage');

  // ---------- Canvas 2D fallback ----------
  function make2DOrb(el, state) {
    const canvas = document.createElement('canvas');
    el.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    function resize(){
      canvas.width = el.clientWidth * DPR;
      canvas.height = el.clientHeight * DPR;
      canvas.style.width = '100%'; canvas.style.height = '100%';
    }
    resize();

    const accentHex = {
      idle:'#4ca8e8', listening:'#6ec4ff', thinking:'#8fd4ff', speaking:'#5ab8f0'
    }[state];

    const COUNT = state==='thinking' ? 1400 : state==='speaking' ? 1300 : 1200;
    const bases = new Float32Array(COUNT*3);
    const meta  = new Float32Array(COUNT*3);
    for (let i=0;i<COUNT;i++){
      const u = Math.random()*2 - 1;
      const th = Math.random()*Math.PI*2;
      const sr = Math.sqrt(1 - u*u);
      bases[i*3]   = sr*Math.cos(th);
      bases[i*3+1] = u;
      bases[i*3+2] = sr*Math.sin(th);
      const isShell = Math.random() < 0.7;
      meta[i*3]   = isShell ? 0.95+Math.random()*0.1 : Math.pow(Math.random(),0.7)*0.9;
      meta[i*3+1] = Math.random()*Math.PI*2;
      meta[i*3+2] = isShell ? 0 : 1;
    }
    function noise3(x,y,z){
      return (Math.sin(x*1.3+y*0.7+z*1.1) + Math.sin(y*1.7-x*0.9+z*0.5)*0.7 + Math.sin(z*1.1+x*0.5-y*1.3)*0.5)/2.2;
    }

    const start = performance.now();
    function tick(now){
      const t = (now - start)/1000;
      const W = canvas.width, H = canvas.height;
      const cx = W/2, cy = H/2;
      const R = Math.min(W,H)*0.32;

      // Soft trailing clear (creates motion smear, matches foggy vibe)
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0,0,W,H);

      let scale=1, noiseAmt=0.06, swirl=0.12, flowSpeed=0.25, noiseFreq=1.4, glowOp=0.3;
      if (state==='idle') { scale=0.9+Math.sin(t*0.9)*0.07; noiseAmt=0.07+Math.sin(t*0.6)*0.02; swirl=0.15; flowSpeed=0.22; glowOp=0.30+Math.sin(t*0.9)*0.06; }
      else if (state==='listening') { scale=1.02+Math.sin(t*2.2)*0.08; noiseAmt=0.10+Math.sin(t*2.2)*0.05; swirl=0.25; flowSpeed=0.35; noiseFreq=1.6; glowOp=0.45+Math.sin(t*2.2)*0.12; }
      else if (state==='thinking') { scale=0.88+Math.abs(Math.sin(t*4.5))*0.18; noiseAmt=0.18+Math.sin(t*6)*0.06; swirl=1.1; flowSpeed=0.9; noiseFreq=2.2; glowOp=0.4+Math.abs(Math.sin(t*5))*0.2; }
      else if (state==='speaking') { const v=Math.abs(Math.sin(t*6.7))*0.55+Math.abs(Math.sin(t*11.3))*0.30+Math.abs(Math.sin(t*17.1))*0.15; scale=1.0+v*0.40; noiseAmt=0.10+v*0.18; swirl=0.45; flowSpeed=0.55; noiseFreq=1.7; glowOp=0.45+v*0.4; }

      const offsetY = Math.sin(t*0.7)*0.10 * R;
      const offsetX = Math.sin(t*0.5+1.2)*0.05 * R;

      // Center glow — very dim, just a hint
      const grad = ctx.createRadialGradient(cx+offsetX, cy+offsetY, 0, cx+offsetX, cy+offsetY, R*1.4*scale);
      grad.addColorStop(0, accentHex + '22');
      grad.addColorStop(0.5, accentHex + '0c');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath(); ctx.arc(cx+offsetX, cy+offsetY, R*1.5*scale, 0, Math.PI*2); ctx.fill();

      // Rotate around Y for swirl
      const yaw = t*swirl;
      const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
      const pitch = Math.sin(t*0.4)*0.15;
      const cosP = Math.cos(pitch), sinP = Math.sin(pitch);

      for (let i=0;i<COUNT;i++){
        const bx=bases[i*3], by=bases[i*3+1], bz=bases[i*3+2];
        const r0=meta[i*3], phase=meta[i*3+1], interior=meta[i*3+2];
        const n = noise3(bx*noiseFreq+t*flowSpeed, by*noiseFreq+t*flowSpeed*0.7, bz*noiseFreq+t*flowSpeed*0.9);
        const breathe = Math.sin(t*1.6+phase)*0.02;
        let r = (r0 + noiseAmt*n + breathe) * scale;
        if (interior) r *= 0.3 + Math.abs(Math.sin(phase+t*0.6))*0.7;

        // rotate Y
        let x = bx*cosY + bz*sinY;
        let z = -bx*sinY + bz*cosY;
        let y = by;
        // rotate X (pitch)
        const y2 = y*cosP - z*sinP;
        const z2 = y*sinP + z*cosP;
        y = y2; z = z2;

        x *= r; y *= r; z *= r;

        // Simple perspective
        const persp = 1 / (1 - z*0.18);
        const sx = cx + offsetX + x*R*persp;
        const sy = cy + offsetY + y*R*persp;

        // Depth-based alpha & size — dim blue particles, not white
        const depth = (z + 1) / 2; // 0..1
        const a = (0.25 + depth*0.55) * (interior ? 0.45 : 1);
        const sz = (0.8 + depth*1.0) * DPR;

        // Very occasional brighter highlight (6%)
        if (((i * 2654435761) & 0xff) < 16) {
          ctx.fillStyle = `rgba(180,210,240,${a.toFixed(3)})`;
        } else {
          ctx.fillStyle = `rgba(80,130,180,${a.toFixed(3)})`;
        }
        ctx.fillRect(sx, sy, sz, sz);
      }
      ctx.globalCompositeOperation = 'source-over';

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    new ResizeObserver(resize).observe(el);
  }

  // Three.js guard
  if (typeof THREE === 'undefined' || !THREE.WebGLRenderer) {
    document.querySelectorAll('.stage').forEach(s => make2DOrb(s, s.dataset.state));
    return;
  }

  // Soft particle sprite — tiny dot with gentle glow
  const partTex = (function(){
    const c = document.createElement('canvas'); c.width=c.height=32;
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(16,16,0,16,16,16);
    rg.addColorStop(0,'rgba(255,255,255,1)');
    rg.addColorStop(0.25,'rgba(200,230,255,.8)');
    rg.addColorStop(0.6,'rgba(110,196,255,.25)');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg; g.fillRect(0,0,32,32);
    return new THREE.CanvasTexture(c);
  })();

  // Simplex-like cheap 3D noise via trigonometric approximation
  function noise3(x, y, z) {
    return (
      Math.sin(x*1.3 + y*0.7 + z*1.1) +
      Math.sin(y*1.7 - x*0.9 + z*0.5) * 0.7 +
      Math.sin(z*1.1 + x*0.5 - y*1.3) * 0.5
    ) / 2.2;
  }

  function makeOrb(el, state) {
    const w = el.clientWidth, h = el.clientHeight;

    // Try WebGL first; if unavailable, fall back to Canvas 2D
    let gl = null;
    try {
      const probe = document.createElement('canvas');
      gl = probe.getContext('webgl') || probe.getContext('experimental-webgl');
    } catch (e) { gl = null; }

    if (!gl || typeof THREE === 'undefined' || !THREE.WebGLRenderer) {
      return make2DOrb(el, state);
    }

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
    } catch (e) {
      return make2DOrb(el, state);
    }

    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(50, w/h, 0.1, 100);
    cam.position.z = 4.2;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h, false);
    renderer.setClearColor(0x000000, 0);
    el.appendChild(renderer.domElement);

    // State-tinted color
    const accent = {
      idle:      new THREE.Color('#4ca8e8'),
      listening: new THREE.Color('#6ec4ff'),
      thinking:  new THREE.Color('#8fd4ff'),
      speaking:  new THREE.Color('#5ab8f0'),
    }[state];

    const group = new THREE.Group();
    scene.add(group);

    // Two particle shells: outer surface (denser) + inner volume (sparse)
    // Each particle has a base direction on the unit sphere and a radius.
    const COUNT = state === 'thinking' ? 2600 : (state === 'speaking' ? 2400 : 2200);
    const positions = new Float32Array(COUNT*3);
    const bases = new Float32Array(COUNT*3); // unit direction
    const meta  = new Float32Array(COUNT*3); // baseR, phase, shell (0=shell, 1=interior)

    for (let i=0;i<COUNT;i++){
      // Uniform direction on sphere
      const u = Math.random()*2 - 1;
      const th = Math.random()*Math.PI*2;
      const sr = Math.sqrt(1 - u*u);
      const dx = sr*Math.cos(th), dy = u, dz = sr*Math.sin(th);
      bases[i*3] = dx; bases[i*3+1] = dy; bases[i*3+2] = dz;

      // 70% on outer shell, 30% inside (sparser) to give volumetric feel
      const isShell = Math.random() < 0.7;
      const r = isShell
        ? 0.95 + Math.random()*0.1
        : Math.pow(Math.random(), 0.7) * 0.92;
      meta[i*3] = r;
      meta[i*3+1] = Math.random()*Math.PI*2;
      meta[i*3+2] = isShell ? 0 : 1;

      positions[i*3] = dx*r; positions[i*3+1] = dy*r; positions[i*3+2] = dz*r;
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const mat = new THREE.PointsMaterial({
      size: 0.020,
      map: partTex,
      transparent: true,
      opacity: 0.85,
      depthWrite: false,
      blending: THREE.NormalBlending,
      color: accent.clone().multiplyScalar(0.55),
      sizeAttenuation: true,
    });
    const points = new THREE.Points(geom, mat);
    group.add(points);

    // Tiny highlight layer — only 6% of particles, slightly brighter, for hint of shimmer
    const HL = Math.floor(COUNT * 0.06);
    const hlPos = new Float32Array(HL*3);
    const hlIdx = new Uint32Array(HL);
    for (let i=0;i<HL;i++){ hlIdx[i] = Math.floor(Math.random()*COUNT); }
    const hlGeom = new THREE.BufferGeometry();
    hlGeom.setAttribute('position', new THREE.BufferAttribute(hlPos, 3));
    const hlMat = new THREE.PointsMaterial({
      size: 0.028, map: partTex, transparent:true, opacity:0.6,
      depthWrite:false, blending: THREE.AdditiveBlending,
      color: accent.clone().lerp(new THREE.Color(0xffffff), 0.2),
      sizeAttenuation:true,
    });
    const highlights = new THREE.Points(hlGeom, hlMat);
    group.add(highlights);

    // Dark rim glow — very subtle dim blue halo (no bright white)
    const glowTex = (function(){
      const c = document.createElement('canvas'); c.width=c.height=128;
      const g = c.getContext('2d');
      const rg = g.createRadialGradient(64,64,0,64,64,64);
      rg.addColorStop(0, '#' + accent.getHexString() + '18');
      rg.addColorStop(0.5, '#' + accent.getHexString() + '08');
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle=rg; g.fillRect(0,0,128,128);
      return new THREE.CanvasTexture(c);
    })();
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, transparent:true, opacity:0.12,
      blending: THREE.AdditiveBlending, depthWrite:false,
    }));
    glow.scale.set(2.8, 2.8, 1);
    group.add(glow);

    // Animation
    let raf; const start = performance.now();
    const posAttr = geom.attributes.position;

    function tick(now){
      const t = (now - start) / 1000;

      // State-specific parameters
      let scale = 1;           // overall size (grow/shrink)
      let noiseAmt = 0.06;     // surface displacement
      let swirl = 0.12;        // rotation speed along axis
      let flowSpeed = 0.25;    // noise evolution
      let noiseFreq = 1.4;
      let glowOp = 0.3;

      if (state === 'idle') {
        scale = 0.90 + Math.sin(t*0.9)*0.07;
        noiseAmt = 0.07 + Math.sin(t*0.6)*0.02;
        swirl = 0.15;
        flowSpeed = 0.22;
        glowOp = 0.30 + Math.sin(t*0.9)*0.06;
      }
      else if (state === 'listening') {
        // Expands and pulses outward rhythmically
        scale = 1.02 + Math.sin(t*2.2)*0.08 + Math.max(0, Math.sin(t*0.7))*0.05;
        noiseAmt = 0.10 + Math.sin(t*2.2)*0.05;
        swirl = 0.25;
        flowSpeed = 0.35;
        noiseFreq = 1.6;
        glowOp = 0.45 + Math.sin(t*2.2)*0.12;
      }
      else if (state === 'thinking') {
        // Rapid swirl + size flicker; particles scatter more
        scale = 0.88 + Math.abs(Math.sin(t*4.5))*0.18;
        noiseAmt = 0.18 + Math.sin(t*6)*0.06;
        swirl = 1.1;
        flowSpeed = 0.9;
        noiseFreq = 2.2;
        glowOp = 0.4 + Math.abs(Math.sin(t*5))*0.2;
      }
      else if (state === 'speaking') {
        // Voice-driven multi-sine grow/shrink, stronger expansion
        const voice = Math.abs(Math.sin(t*6.7))*0.55 + Math.abs(Math.sin(t*11.3))*0.30 + Math.abs(Math.sin(t*17.1))*0.15;
        scale = 1.0 + voice*0.40;
        noiseAmt = 0.10 + voice*0.18;
        swirl = 0.45;
        flowSpeed = 0.55;
        noiseFreq = 1.7;
        glowOp = 0.45 + voice*0.4;
      }

      // Float & rotate
      group.position.y = Math.sin(t*0.7)*0.10;
      group.position.x = Math.sin(t*0.5 + 1.2)*0.05;
      group.rotation.y = t * swirl;
      group.rotation.x = Math.sin(t*0.4) * 0.15;

      // Displace each particle: base direction + radial noise push-pull
      const flowT = t * flowSpeed;
      for (let i=0;i<COUNT;i++){
        const bx = bases[i*3], by = bases[i*3+1], bz = bases[i*3+2];
        const r0 = meta[i*3];
        const phase = meta[i*3+1];
        const isInterior = meta[i*3+2];

        // Noise modulates radius (fog-like surface undulation)
        const n = noise3(bx*noiseFreq + flowT, by*noiseFreq + flowT*0.7, bz*noiseFreq + flowT*0.9);
        const breathe = Math.sin(t*1.6 + phase)*0.02;
        const radialPush = noiseAmt * n + breathe;
        // Interior particles move a bit more independently
        const rMul = isInterior ? (0.4 + 0.6*Math.abs(Math.sin(phase + t*0.6))) : 1;
        const r = (r0 + radialPush) * scale * (isInterior ? (0.2 + rMul*0.85) : 1);

        // Tangential swirl: rotate direction slightly around Y axis using per-particle offset
        const wobA = 0.08 * Math.sin(t*0.9 + phase);
        const wobB = 0.08 * Math.cos(t*0.7 + phase*1.3);
        const dx = bx + wobB*bz;
        const dz = bz - wobB*bx;
        const dy = by + wobA;

        const len = Math.hypot(dx, dy, dz) || 1;
        posAttr.array[i*3]   = (dx/len) * r;
        posAttr.array[i*3+1] = (dy/len) * r;
        posAttr.array[i*3+2] = (dz/len) * r;
      }
      posAttr.needsUpdate = true;

      // Update highlight positions (sample subset of main positions)
      const hlArr = hlGeom.attributes.position.array;
      for (let j=0;j<HL;j++){
        const k = hlIdx[j];
        hlArr[j*3]   = posAttr.array[k*3];
        hlArr[j*3+1] = posAttr.array[k*3+1];
        hlArr[j*3+2] = posAttr.array[k*3+2];
      }
      hlGeom.attributes.position.needsUpdate = true;

      // Subtle point size pulse to sell the grow/shrink on small screens
      mat.size = 0.022 + (scale - 1) * 0.015 + Math.sin(t*1.3)*0.002;
      glow.material.opacity = glowOp;
      glow.scale.setScalar(2.4 + (scale - 1) * 2.2);

      renderer.render(scene, cam);
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    const ro = new ResizeObserver(()=>{
      const W = el.clientWidth, H = el.clientHeight;
      renderer.setSize(W, H, false);
      cam.aspect = W/H; cam.updateProjectionMatrix();
    });
    ro.observe(el);
  }

  stages.forEach(s => makeOrb(s, s.dataset.state));
})();
</script>
</body></html>
